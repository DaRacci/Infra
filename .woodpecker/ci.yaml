when:
  - event: manual
  - event: push
    branch: master
    path: &changes
      include:
        - "flake.*"
        - "terraform/**"
        - ".woodpecker/**"
  - event: pull_request
    path: *changes

steps:
  - name: Format
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    depends_on: []
    commands: nix fmt -- --ci

  - name: Terraform Validate
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    directory: terraform
    commands: |
      nix develop --command terraform init -backend=false -upgrade
      nix develop --command terraform validate

  - name: Run flake checker
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    commands: nix run nixpkgs#flake-checker
