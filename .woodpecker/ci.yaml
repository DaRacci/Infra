when:
  - event: manual
  - event: push
    branch: master
    path: &changes
      include:
        - "flake.*"
        - "terraform/**"
        - ".woodpecker/**"
  - event: pull_request
    path: *changes

matrix:
  UNIT:
    - dns
    - tailscale
    - cloud
    - proxmox

steps:
  - name: Format
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    depends_on: []
    commands: nix fmt -- --ci

  - name: Terraform Validate
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    directory: terraform/units/${UNIT}
    commands: |
      nix develop --impure --command terragrunt validate

  - name: Run flake checker
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    commands: nix run nixpkgs#flake-checker
