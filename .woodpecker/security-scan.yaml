when:
  - event: [pull_request, manual]
  - event: push
    branch: master

steps:
  - name: GitGuardian Secret Scan
    image: gitguardian/ggshield:latest
    pull: true
    environment:
      GITGUARDIAN_API_KEY:
        from_secret: GITGUARDIAN_API_KEY
    commands: ggshield secret scan commit-range ${CI_PREV_COMMIT_SHA}..
